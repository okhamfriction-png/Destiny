[package]
name = "destiny-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = []
# Transcription whisper.cpp + VAD Silero. whisper.cpp est compilé (cmake) ; onnxruntime
# est chargé dynamiquement à l'exécution (`brew install onnxruntime`, ORT_DYLIB_PATH),
# pas téléchargé au build.
asr = ["dep:whisper-rs", "dep:ort"]
# Whisper sur le GPU du Mac (Apple Silicon).
metal = ["asr", "whisper-rs/metal"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
schemars.workspace = true
json-patch.workspace = true
rayon.workspace = true
hound.workspace = true
realfft.workspace = true
md-5.workspace = true
whisper-rs = { version = "0.16", optional = true }
ort = { version = "=2.0.0-rc.14", optional = true, default-features = false, features = ["std", "load-dynamic"] }

[dev-dependencies]
tempfile = "3"
