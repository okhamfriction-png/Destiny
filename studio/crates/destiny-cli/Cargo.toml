[package]
name = "destiny-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "destiny-cli"
path = "src/main.rs"

[features]
asr = ["destiny-core/asr"]
# metal implique asr ici aussi : sinon `--features metal` compile whisper dans le cœur mais la
# CLI garde son garde-fou `cfg(not(feature = "asr"))` et refuse `--model`.
metal = ["asr", "destiny-core/metal"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
clap.workspace = true
json-patch.workspace = true
destiny-core.workspace = true
