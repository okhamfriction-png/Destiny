[workspace]
resolver = "2"
members = ["crates/destiny-core", "crates/destiny-cli"]
# src-tauri nécessite webkit2gtk (Linux) / WebKit (macOS) : `cargo test` à la racine
# ne compile que le cœur et la CLI.
default-members = ["crates/destiny-core", "crates/destiny-cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl"] }
schemars = "1"
json-patch = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "fs", "time"] }
rayon = "1"
hound = "3.5"
realfft = "3.5"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
destiny-core = { path = "crates/destiny-core" }
