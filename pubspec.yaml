name: destiny
description: DestinyStory - generateur de situations d'improvisation theatrale.
publish_to: "none"

version: 2.4.1+32

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  audioplayers: ^6.1.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.7.0
  wakelock_plus: ^1.2.8
  speech_to_text: ^7.4.0
  file_picker: ^13.0.0
  # Import du pack audio du spectacle en .zip, lu en flux (sans tout charger).
  archive: ^4.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  # Sous-dépendance de pdf : les versions 4.6 et plus attendent une version
  # d'archive que pdf 3.12 n'accepte pas encore.
  image: ">=4.0.0 <4.6.0"


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon_full.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_full.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/data/destiny_grammaire.json
    - assets/data/destiny_audio.json
    - assets/data/destiny_textes.json
    - assets/data/migration/catalogue_1_5_7.json
    - assets/data/locations.json
    - assets/data/location_details.json
    - assets/data/exercices.json
    - assets/data/univers.json
    - assets/data/campagne_lieux.json
    - assets/data/campagne_mechants.json
    - assets/data/campagne_archetypes.json
    - assets/data/dangers.json
    - assets/data/archetypes.json
    - assets/data/dilemmas.json
    - assets/fonts/OFL-Cinzel.txt
    - assets/fonts/OFL-Montserrat.txt
    - assets/fonts/OFL-PatrickHand.txt
    - assets/audio/DestinyStorm.wav
    - assets/audio/story_epic.wav
    - assets/audio/coin.wav
    - assets/audio/dice.wav
    - assets/audio/crack.wav
    - assets/audio/shine.wav
    - assets/audio/thunder.wav
    - assets/audio/reveal.wav
    - assets/audio/ambiences/
    - assets/audio/universes/
    - assets/images/archetypes/
    - assets/images/locations/
    - assets/images/dangers/
    - assets/images/destiny_cube.png
    - assets/images/logo_destiny.png
    - assets/music/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cinzel-Black.ttf
          weight: 900
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
