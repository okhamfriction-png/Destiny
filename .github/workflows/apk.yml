# Construit l'APK Android sur les serveurs de GitHub et le joint à la release
# du tag poussé (v2.0.0, v2.0.1…).
#
# Signature : si les secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS,
# ANDROID_STORE_PASSWORD et ANDROID_KEY_PASSWORD existent, l'APK est signé
# avec la clé de release (celle du Play Store). Sinon, il est signé avec une
# clé de test, et la release est marquée « pré-version ».
name: Construire l'APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse
        run: flutter analyze --no-fatal-infos

      - name: Clé de signature (si elle est dans les secrets)
        id: cle
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "storeFile=$RUNNER_TEMP/upload.jks"
              echo "keyAlias=$KEY_ALIAS"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
            } > android/key.properties
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pas de clé de release dans les secrets : APK signé avec une clé de test."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK
        run: flutter build apk --release

      - name: Nom de l'APK
        id: nom
        run: |
          nom="DestinyStory-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$nom"
          echo "fichier=$nom" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nom.outputs.fichier }}
          path: ${{ steps.nom.outputs.fichier }}
          retention-days: 30

      - name: Release du tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNE: ${{ steps.cle.outputs.release }}
        run: |
          tag="$GITHUB_REF_NAME"
          source="docs/release_notes/$tag.md"
          notes="$RUNNER_TEMP/notes.md"
          titre="DestinyStory $tag"
          if [ -f "$source" ]; then
            # La première ligne (« # Titre ») devient le titre de la release.
            premiere=$(head -n 1 "$source" | sed 's/^# //')
            [ -n "$premiere" ] && titre="$premiere"
            tail -n +2 "$source" > "$notes"
          else
            echo "Version $tag. Voir CHANGELOG.md." > "$notes"
          fi
          options=()
          if [ "$SIGNE" != "true" ]; then options+=(--prerelease); fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$titre" --notes-file "$notes" --verify-tag "${options[@]}"
          fi
          gh release upload "$tag" "${{ steps.nom.outputs.fichier }}" --clobber
