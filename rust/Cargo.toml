[package]
name = "rust_lib_destiny"
version = "0.1.0"
edition = "2021"
description = "Cœur logique de DestinyStory (tirage des histoires, escalade) partagé Android / iOS."
publish = false

[lib]
# cdylib : .so Android ; staticlib : .a iOS ; lib : tests Rust.
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
anyhow = "1"
flutter_rust_bridge = "=2.11.1"
rand = { version = "0.8.5", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
